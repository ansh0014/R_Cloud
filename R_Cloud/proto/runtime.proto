syntax = "proto3";

package rcloud.runtime;

option go_package = "github.com/r-cloud/shared/proto/runtime";

service RuntimeService {    
  rpc CreateRuntime    (CreateRuntimeRequest)    returns (CreateRuntimeResponse);
  rpc StopRuntime      (StopRuntimeRequest)      returns (StopRuntimeResponse);
  rpc RestartRuntime   (RestartRuntimeRequest)   returns (RestartRuntimeResponse);
  rpc DeleteRuntime    (DeleteRuntimeRequest)    returns (DeleteRuntimeResponse);
  rpc GetRuntimeStatus (GetRuntimeStatusRequest) returns (GetRuntimeStatusResponse);
}

enum RuntimeStatus {
  CREATING   = 0;
  RUNNING    = 1;
  STOPPED    = 2;
  RESTARTING = 3;
  DELETED    = 4;
  FAILED     = 5;
}

enum HealthStatus {
  STARTING  = 0;
  HEALTHY   = 1;
  UNHEALTHY = 2;
  UNKNOWN   = 3;
}

message ServicePlan {
  string name           = 1;
  string entrypoint     = 2;
  string execute_route  = 3;
  string health_route   = 4;
  string metadata_route = 5;
}

message CreateRuntimeRequest {
  string              deployment_id = 1;
  string              provider      = 2;
  string              mode          = 3;
  string              runtime       = 4;
  string              framework     = 5;
  string              build_command = 6;
  string              start_command = 7;
  map<string, string> environment   = 8;
  repeated ServicePlan services     = 9;
}

message DeployedAgent {
  string agent_id  = 1;
  string agent_url = 2;
}

message CreateRuntimeResponse {
  string        runtime_id  = 1;
  RuntimeStatus status      = 2;
  repeated DeployedAgent agents = 3;
}

message StopRuntimeRequest {
  string runtime_id    = 1;
  string deployment_id = 2;
}

message StopRuntimeResponse {
  string        runtime_id = 1;
  RuntimeStatus status     = 2;
  string        message    = 3;
}

message RestartRuntimeRequest {
  string runtime_id    = 1;
  string deployment_id = 2;
}

message RestartRuntimeResponse {
  string        runtime_id = 1;
  RuntimeStatus status     = 2;
  string        message    = 3;
}

message DeleteRuntimeRequest {
  string runtime_id    = 1;
  string deployment_id = 2;
}

message DeleteRuntimeResponse {
  bool   success = 1;
  string message = 2;
}

message GetRuntimeStatusRequest {
  string runtime_id    = 1;
  string deployment_id = 2;
}

message AgentStatus {
  string agent_id = 1;
  string agent_url = 2;
  HealthStatus health = 3;
}

message GetRuntimeStatusResponse {
  string        runtime_id      = 1;
  RuntimeStatus status          = 2;
  HealthStatus  overall_health  = 3;
  string        last_checked_at = 4;
  repeated AgentStatus agents   = 5;
}
